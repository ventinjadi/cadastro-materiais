<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#253a57"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>Materiais</title></head><body><main class="shell"><header class="top"><div class="bar"><div class="brand"><div class="mark">▦</div><div><h1>Materiais</h1><div id="driveStatus" class="account">Conecte seu Google Drive</div></div></div><button id="connectBtn" class="ghost">Conectar Drive</button><button id="newBtn" class="primary" hidden>＋ <span>Novo material</span></button></div></header><section id="welcome" class="welcome"><div class="welcome-icon">▦</div><h2>Seu cadastro de materiais</h2><p>Registros e fotos ficam na área privada do seu Google Drive e acompanham você em qualquer aparelho.</p><button id="welcomeConnect" class="primary wide">Conectar com Google</button><small>O aplicativo acessa apenas os arquivos que ele próprio cria.</small></section><section id="workspace" hidden><div class="tools"><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar material, NC ou responsável"></div><select id="filter"><option value="all">Todos</option><option value="nc">Com NC</option><option value="no-nc">Sem NC</option></select></div><div id="summary" class="summary"></div><section id="list" class="grid"></section></section></main><dialog id="dialog"><form id="form" class="modal"><div class="modalhead"><h2 id="formTitle">Novo material</h2><button type="button" id="closeBtn" class="close">×</button></div><div class="fields"><label class="upload" for="photo"><div id="preview" class="preview">Foto</div><div><strong>Fotografar ou escolher imagem <b>*</b></strong><small>A foto ficará salva no seu Google Drive.</small></div><input id="photo" type="file" accept="image/*" capture="environment" hidden></label><div class="field"><label for="name">Material <b>*</b></label><input id="name" maxlength="120" required placeholder="Ex.: Torneira metálica"></div><div class="field"><label for="description">Descrição <b>*</b></label><textarea id="description" maxlength="1200" required placeholder="Características, quantidade, local ou observações"></textarea></div><label class="toggle"><input id="hasNc" type="checkbox"><strong>Este material vem de uma NC</strong></label><div id="ncField" class="field" hidden><label for="ncNumber">Número ou referência da NC <b>*</b></label><input id="ncNumber" maxlength="100" placeholder="Ex.: NC 014/2026"></div><div class="field"><label for="responsible">Responsável <em>(opcional)</em></label><input id="responsible" maxlength="120" placeholder="Nome do responsável"></div></div><div class="actions"><button id="deleteBtn" type="button" class="danger" hidden>Excluir</button><div class="right"><button id="cancelBtn" type="button" class="ghost">Cancelar</button><button id="saveBtn" class="primary">Salvar</button></div></div></form></dialog><div id="toast" class="toast"></div><script src="https://accounts.google.com/gsi/client" async defer></script><script src="app.js" defer></script></body></html>
